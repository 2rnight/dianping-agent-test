  server:
    port: 8081
  spring:
    rabbitmq:
      listener:
        simple:
          auto-startup: true
          acknowledge-mode: manual
          concurrency: 5
          prefetch: 10
      host: localhost
      # 注意：本机 5672 被 Windows 占用，RabbitMQ 跑在 Docker 里，
      # 这里填的是宿主机映射端口（对应启动参数 -p 25672:5672），不要改成 5672
      port: 25672
      username: guest
      password: guest
    application:
      name: hmdp
    datasource:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: 123456
    redis:
      host: 127.0.0.1
      port: 6379

      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          time-between-eviction-runs: 10s
    jackson:
      default-property-inclusion: non_null # JSON处理时忽略非空字段
  mybatis-plus:
    type-aliases-package: com.hmdp.entity # 别名扫描包
  logging:
    level:
      com.hmdp: debug
